[package]
name = "crawlcontract"
version = "0.3.0"
edition = "2021"
description = "A deterministic CI gate that proves a site's crawl, canonical and indexability signals agree"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/lame13/crawlcontract"
readme = "README.md"
keywords = ["seo", "crawler", "canonical", "sitemap", "ci"]
categories = ["command-line-utilities", "web-programming"]

[[bin]]
name = "crawlcontract"
path = "src/main.rs"

[lib]
name = "crawlcontract"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "alloc"] }
clap = { version = "4", features = ["derive"] }
colored = "3"
futures-util = "0.3"
quick-xml = { version = "0.38", features = ["serialize"] }
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
scraper = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2.5", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
